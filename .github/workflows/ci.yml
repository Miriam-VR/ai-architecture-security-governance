name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-unit:
    name: Lint + unit/integration tests (offline, mock mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app handlers scripts tests
      - name: Unit + integration (no network, no cloud)
        run: pytest tests/unit tests/integration -q

  security:
    name: Security suite (blocks isolation / injection / approval regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Security tests (includes the "break it on purpose" check)
        run: pytest tests/security -q
      - name: Dependency audit (report only)
        continue-on-error: true
        run: pip install pip-audit && pip-audit

  evaluation:
    name: AI evaluation gate (golden + adversarial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run scorecard (fails below thresholds)
        run: |
          python scripts/run_eval.py --min-golden 1.0 --min-adversarial 1.0 --out evaluation_report.json 2>/dev/null | tee scorecard.md
          { echo '## AI evaluation scorecard'; grep -v '^GATE' scorecard.md; } >> "$GITHUB_STEP_SUMMARY"
          grep -q '^GATE: PASS' scorecard.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation_report.json

  postgres:
    name: Supabase-compatible Postgres (pgvector) integration
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/apply_migrations.py --seed --stub-auth
      - run: pytest tests/integration/test_pg_store.py -q

  terraform-static:
    name: Terraform fmt + validate (no AWS credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive -diff infrastructure/terraform
      - name: validate every stack
        run: |
          for d in bootstrap environments/dev environments/workshop; do
            echo "::group::validate $d"
            terraform -chdir=infrastructure/terraform/$d init -backend=false -input=false
            terraform -chdir=infrastructure/terraform/$d validate
            echo "::endgroup::"
          done

  terraform-plan:
    name: Terraform plan (PRs from this repo, read-only role via OIDC)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    needs: terraform-static
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/maintenance-ai-gha-plan
          aws-region: ${{ vars.AWS_REGION }}
      - name: plan (dev)
        working-directory: infrastructure/terraform/environments/dev
        env:
          TF_VAR_lambda_image_uri: ${{ vars.LAMBDA_IMAGE_URI_DEV }}
          TF_VAR_jwt_issuer: ${{ vars.JWT_ISSUER }}
          TF_VAR_jwt_jwks_url: ${{ vars.JWT_JWKS_URL }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo '## Terraform plan (dev)'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build images + vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build lambda image
        run: docker build -f Dockerfile.lambda -t maint-lambda:ci .
      - name: build ec2 image
        run: docker build -f Dockerfile.ec2 -t maint-ec2:ci .
      - name: Trivy (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: maint-ec2:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Smoke the EC2 image
        run: |
          docker run -d --name app -p 8000:8000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret-1234567 -e MCP_SHARED_SECRET=ci-mcp-ci-mcp-ci-mcp-ci-mcp-12345 maint-ec2:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break || sleep 2; done
          pip install pyjwt
          TOKEN=$(JWT_SECRET=ci-secret-ci-secret-ci-secret-1234567 python scripts/mint_token.py)
          python scripts/smoke_test.py --base-url http://localhost:8000 --token "$TOKEN"

  gate:
    name: CI gate (the single required check)
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-unit, security, evaluation, postgres, terraform-static, docker, terraform-plan]
    steps:
      - name: All required jobs succeeded (terraform-plan may be skipped)
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json,sys
          bad=[k for k,v in json.load(sys.stdin).items() if v['result'] not in ('success','skipped')]
          print('failed:',bad); sys.exit(1 if bad else 0)"

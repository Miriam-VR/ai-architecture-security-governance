[project]
name = "industrial-maintenance-ai"
version = "0.1.0"
description = "Agente de IA para diagnostico de mantenimiento industrial (workshop: arquitectura, seguridad, gobierno)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "mangum>=0.19",
  "boto3>=1.35",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "handlers*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "pg: requires TEST_DATABASE_URL (Postgres + pgvector); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "S311", "E501", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501", "S603", "S607", "B007"]
"scripts/**" = ["S603", "S607"]
